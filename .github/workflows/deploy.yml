name: Deploy TH COMPANY ERP to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Verify compiled site
        run: |
          test -f dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "Erro: dist/index.html ainda aponta para o arquivo-fonte src/main.tsx."
            exit 1
          fi
          if ! grep -q '/TH-COMPANY-ERP/' dist/index.html; then
            echo "Erro: o HTML compilado não contém o caminho base esperado do GitHub Pages."
            exit 1
          fi
          echo "HTML compilado validado."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
